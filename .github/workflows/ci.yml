name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply Qdrant patches
        shell: bash
        run: ./scripts/apply-patches.sh

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2

      - name: Rust tests (core + conformance + crash recovery)
        run: cargo test --release -p neoquadrant

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node binding
        working-directory: bindings/node
        run: |
          npm run build
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python binding
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./bindings/python[test]"
          python -m pytest -q bindings/python/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: ./scripts/apply-patches.sh
      - uses: Swatinem/rust-cache@v2
      # Only our packages: `--all` would also reformat the vendored Qdrant sources.
      - run: cargo fmt -p neoquadrant -p neoquadrant-node -p neoquadrant-python --check
      - run: cargo clippy -p neoquadrant -p neoquadrant-node -p neoquadrant-python --all-targets -- -D warnings
