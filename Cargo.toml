[workspace]
resolver = "3"
members = ["crates/neoquadrant", "bindings/node", "bindings/python"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
neoquadrant = { path = "crates/neoquadrant" }
# Qdrant engine (vendored submodule, pinned to v1.19.2)
edge = { path = "vendor/qdrant/lib/edge" }
segment = { path = "vendor/qdrant/lib/segment", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
